<script>
  const p3Pools = {
    t1: ['DSC_0146.JPG','DSC_0151.JPG','DSC_0163.JPG','DSC_0174.JPG','DSC_0178.JPG','DSC_0179.JPG','DSC_0187.JPG','DSC_0205.JPG','DSC_0282.JPG','DSC_0300.JPG'],
    t2: ['DSC_0808.JPG','DSC_0813.JPG','DSC_0816.JPG','DSC_0875.JPG','DSC_0876.JPG','DSC_0877.JPG'],
    t3: ['DSC_0683.JPG'],
    t4: ['DSC_0635.JPG','DSC_0663.JPG'],
    t5: ['DSC_0130.JPG','DSC_0264.JPG','DSC_0265.JPG','DSC_0342.JPG','DSC_0403.JPG'],
    t6: ['DSC_0966.JPG'],
    t7: ['DSC_0464.JPG','DSC_0465.JPG'],
  };

  function scheduleSwap(img, folder) {
    const delay = 15000 + Math.random() * 10000;
    setTimeout(() => {
      const pool = p3Pools[folder];
      if (pool.length > 1) {
        const current = img.src.split('/').pop();
        const others = pool.filter(f => f !== current);
        const next = others[Math.floor(Math.random() * others.length)];
        const nextSrc = `photos/portraiture/dara/p3/${folder}/${next}`;
        const preload = new Image();
        preload.onload = () => {
          img.style.transition = 'opacity 2s ease';
          img.style.opacity = '0';
          setTimeout(() => {
            img.src = nextSrc;
            img.style.opacity = '1';
          }, 2000);
        };
        preload.src = nextSrc;
      }
      scheduleSwap(img, folder);
    }, delay);
  }

  document.querySelectorAll('.dara-p3-section img[data-folder]').forEach(img => {
    scheduleSwap(img, img.dataset.folder);
  });
</script>
