<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Favorite logos</title>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #f4f4f4; color: #111; }
    h1 { font-size: 1.25rem; font-weight: 600; margin: 1.25rem 1rem 0.25rem; }
    p { margin: 0 1rem 1rem; color: #555; }
    figure { margin: 0 1rem 1.5rem; background: #fff; border-radius: 12px; overflow: hidden; }
    img { width: 100%; height: auto; display: block; background: #f7f7f7; }
    figcaption { padding: 0.75rem 1rem 1rem; font-size: 0.95rem; }
  </style>
</head>
<body>
  <h1>Favorite logos</h1>
  <p>Five marks, in order.</p>
  <figure>
    <img src="01-camera-with-trumpet.png" alt="Camera with trumpet">
    <figcaption>1. Camera with trumpet</figcaption>
  </figure>
  <figure>
    <img src="02-one-gesture.png" alt="One gesture">
    <figcaption>2. One gesture</figcaption>
  </figure>
  <figure>
    <img src="03-prompt-chevron.png" alt="Prompt chevron">
    <figcaption>3. Prompt chevron</figcaption>
  </figure>
  <figure>
    <img src="04-camera-trumpet-loop.png" alt="Camera and trumpet loop">
    <figcaption>4. Camera and trumpet loop</figcaption>
  </figure>
  <figure>
    <img src="05-camera-trumpet-prompt.png" alt="Camera, trumpet, and prompt">
    <figcaption>5. Camera, trumpet, and prompt</figcaption>
  </figure>
</body>
</html>
